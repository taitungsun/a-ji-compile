<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>AI 小幫手阿吉 編譯</title>
<style>
  :root {
    --font-size-base: 18px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: var(--font-size-base);
    line-height: 1.85;
    -webkit-text-size-adjust: 100%;
  }
  .state-toggle {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .page-wrap {
    --accent: #334155;
    --accent-quote: #475569;
    --bg-page: #f4f5f7;
    --bg-card: #ffffff;
    --bg-quote: #f8fafc;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --text-quote: #334155;
    --border-color: #e2e8f0;
    min-height: 100vh;
    background-color: var(--bg-page);
    color: var(--text-main);
    padding-bottom: 60px;
    transition: background-color 0.2s, color 0.2s;
  }
  #theme-dark:checked ~ .page-wrap {
    --accent: #94a3b8;
    --accent-quote: #64748b;
    --bg-page: #0f172a;
    --bg-card: #1e293b;
    --bg-quote: #263349;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --text-quote: #cbd5e1;
    --border-color: #334155;
  }
  .top-ribbon {
    height: 4px;
    background-color: var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .toolbar {
    position: sticky;
    top: 4px;
    z-index: 99;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-color);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .reader-badge {
    background-color: var(--accent);
    color: var(--bg-card);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 3px 10px;
    border-radius: 4px;
    line-height: 1.3;
  }
  .meta-date {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    display: inline-block;
    background: transparent;
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 13px;
    line-height: 1.4;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn:hover {
    border-color: var(--accent);
  }
  #mode-bi:checked ~ .page-wrap label[for="mode-bi"],
  #mode-zh:checked ~ .page-wrap label[for="mode-zh"],
  #mode-en:checked ~ .page-wrap label[for="mode-en"],
  #show-guide:checked ~ .page-wrap label[for="show-guide"],
  #theme-dark:checked ~ .page-wrap label[for="theme-dark"] {
    border-color: var(--accent);
    background-color: var(--bg-quote);
    color: var(--text-main);
    font-weight: 600;
  }
  .guide {
    display: none;
    margin: 0 0 28px;
    padding: 2px 24px 4px;
    background-color: var(--bg-quote);
    border: 1px solid var(--border-color);
    border-radius: 6px;
  }
  .guide h2 {
    margin-top: 18px;
    font-size: 1.1em;
  }
  #show-guide:checked ~ .page-wrap .guide { display: block; }
  .app-footer {
    max-width: 820px;
    margin: 28px auto 0;
    padding: 0 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.9;
  }
  .app-footer a {
    color: inherit;
    text-decoration: none;
  }
  .app-footer a:hover {
    color: var(--text-main);
    text-decoration: underline;
  }
  .footer-title {
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .container {
    max-width: 820px;
    margin: 28px auto 0;
    background: var(--bg-card);
    padding: 44px 52px;
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    border: 1px solid var(--border-color);
  }
  .status-banner {
    background: var(--bg-quote);
    border: 1px solid var(--border-color);
    border-left: 4px solid #3b82f6;
    border-radius: 4px;
    padding: 12px 16px;
    margin-bottom: 22px;
    font-size: 14px;
    color: var(--text-main);
  }
  .usage-note {
    margin: -14px 0 22px;
    font-size: 12.5px;
    color: var(--text-muted);
  }
  @media print {
    .status-banner, .usage-note, .speak-btn { display: none !important; }
  }
  .speak-btn {
    display: inline-block;
    margin: 8px 0 0;
    padding: 1px 9px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-muted);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 4px;
  }
  .speak-btn:hover,
  .speak-btn.speaking {
    color: var(--text-main);
    border-color: var(--accent);
  }
  p.en-line .speak-btn,
  p.vocab-head .speak-btn {
    margin: 0 0 0 8px;
    vertical-align: 1px;
  }
  p.en-line.en-head {
    margin-top: 0;
    padding-left: 0;
  }
  p.sub-line {
    margin-top: -12px;
    padding-left: 1.6em;
    text-align: left;
  }
  .kk {
    font-family: "Lucida Sans Unicode", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 0.92em;
    color: var(--text-muted);
    white-space: nowrap;
  }
  blockquote[data-n]::before {
    content: attr(data-n);
    float: right;
    margin: -6px -8px 0 12px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 12px;
    color: var(--text-muted);
  }
  a.para-ref {
    color: inherit;
    text-decoration: underline dotted;
    text-underline-offset: 3px;
  }
  h1 {
    font-size: 1.55em;
    line-height: 1.35;
    margin-top: 0;
    margin-bottom: 8px;
    color: var(--text-main);
  }
  .article-subtitle {
    font-family: Georgia, "Charter", "Times New Roman", serif;
    font-size: 1.05em;
    color: var(--text-muted);
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border-color);
  }
  h2 {
    font-size: 1.25em;
    color: var(--accent);
    margin-top: 36px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
  }
  h3 {
    font-size: 1.1em;
    margin-top: 24px;
    margin-bottom: 10px;
  }
  p {
    margin: 0 0 20px 0;
    text-align: justify;
  }
  blockquote {
    margin: 24px 0 12px 0;
    padding: 15px 20px;
    background-color: var(--bg-quote);
    border-left: 4px solid var(--accent-quote);
    border-radius: 0 4px 4px 0;
    font-family: Georgia, "Charter", "Times New Roman", serif;
    font-size: 1.02em;
    line-height: 1.7;
    color: var(--text-quote);
  }
  blockquote p {
    margin: 0;
    text-align: left;
  }
  p.en-line {
    margin-top: -12px;
    padding-left: 1.6em;
    text-align: left;
    color: var(--text-quote);
    font-family: Georgia, "Charter", "Times New Roman", serif;
    line-height: 1.7;
  }
  ul, ol {
    padding-left: 22px;
    margin: 0 0 20px 0;
  }
  li {
    margin-bottom: 10px;
  }
  hr {
    border: none;
    border-top: 1px solid var(--border-color);
    margin: 28px 0;
  }
  code {
    background: var(--bg-quote);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: Menlo, Consolas, Monaco, monospace;
    font-size: 0.9em;
  }
  .table-wrap {
    overflow-x: auto;
    margin: 0 0 20px 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92em;
    line-height: 1.6;
  }
  th, td {
    border: 1px solid var(--border-color);
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  th {
    background-color: var(--bg-quote);
    font-weight: 600;
  }
  #mode-zh:checked ~ .page-wrap main blockquote { display: none; }
  #mode-en:checked ~ .page-wrap main .bilingual-zh { display: none; }
</style>
</head>
<body>
  <input type="radio" name="lang-mode" id="mode-bi" class="state-toggle" checked>
  <input type="radio" name="lang-mode" id="mode-zh" class="state-toggle">
  <input type="radio" name="lang-mode" id="mode-en" class="state-toggle">
  <input type="checkbox" id="show-guide" class="state-toggle">
  <input type="checkbox" id="theme-dark" class="state-toggle">

  <div class="page-wrap">
    <div class="top-ribbon"></div>
    <div class="toolbar">
      <div class="brand-badge">
        <span class="reader-badge" id="badgeSite">Web Article</span>
        <span class="meta-date" id="metaDate">AI 小幫手阿吉 編譯</span>
      </div>
      <div class="controls">
        <label class="btn" for="show-guide">核心導讀</label>
        <label class="btn" for="mode-bi">雙語對照</label>
        <label class="btn" for="mode-zh">僅看中文</label>
        <label class="btn" for="mode-en">僅看英文</label>
        <label class="btn" for="theme-dark">🌗 深淺色</label>
        <button class="btn" type="button" id="btnFontMinus">A-</button>
        <button class="btn" type="button" id="btnFontPlus">A+</button>
        <button class="btn" type="button" id="btnShowFolder" style="display:none;">📂 開啟所在資料夾</button>
        <button class="btn" type="button" id="btnDownloadHtml" style="display:none;">📥 另存 HTML</button>
      </div>
    </div>
    <main class="container">
      <h1 id="pageHeading">正在編譯標題...</h1>
      <div class="article-subtitle" id="articleSubtitle"></div>
      <div class="status-banner" id="statusBanner">⏳ 正在準備連線 Gemini API 進行雙語編譯...</div>
      <div class="usage-note" id="usageNote" hidden></div>
      <div id="renderedContent"></div>
    </main>
    <footer class="app-footer" id="appFooter"></footer>
  </div>

  <script src="models.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
