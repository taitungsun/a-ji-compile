<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<title>阿吉編譯 設定</title>
<style>
  :root {
    --bg-main: #0b1020;
    --bg-card: #151e34;
    --bg-input: #0f1628;
    --border: #2a395c;
    --accent-blue: #60a5fa;
    --accent-purple: #a855f7;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    width: 360px;
    margin: 0;
    padding: 18px;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .header img {
    width: 28px;
    height: 28px;
  }
  .header-title {
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(90deg, #93c5fd, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-ver {
    font-size: 11px;
    color: var(--text-muted);
    margin-left: auto;
  }
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .field {
    margin-bottom: 11px;
  }
  .field:last-child {
    margin-bottom: 0;
  }
  label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    margin-bottom: 5px;
    color: #cbd5e1;
    font-size: 12px;
  }
  label a {
    color: var(--accent-blue);
    text-decoration: none;
    font-weight: 400;
    font-size: 11.5px;
  }
  label a:hover {
    text-decoration: underline;
  }
  select, input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--bg-input);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 9px;
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
  }
  select:focus, input:focus {
    border-color: var(--accent-blue);
  }
  .key-wrap {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    background: var(--bg-input);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0 9px;
    cursor: pointer;
    font-size: 12px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-size: 12px;
    color: #cbd5e1;
    cursor: pointer;
  }
  .checkbox-row input {
    margin: 0;
  }
  .actions {
    display: flex;
    gap: 8px;
  }
  .btn-primary {
    flex: 1;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover {
    opacity: 0.92;
  }
  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .btn-secondary:hover {
    border-color: var(--accent-blue);
  }
  .status-msg {
    margin-top: 10px;
    font-size: 12px;
    min-height: 18px;
    text-align: center;
  }
  .hint {
    font-size: 11.5px;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.55;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="阿吉編譯">
    <span class="header-title">阿吉編譯</span>
    <span class="header-ver">v2.0</span>
  </div>

  <!-- Gemini API 設定面板 -->
  <div class="panel" id="panel-api">
    <div class="field">
      <label for="apiKey">
        <span>Gemini API Key 金鑰</span>
        <a href="https://aistudio.google.com/apikey" target="_blank" id="keyLink">取得免費 Gemini Key ↗</a>
      </label>
      <div class="key-wrap">
        <input type="password" id="apiKey" placeholder="貼上您的 API Key (僅儲存於本機瀏覽器)">
        <button type="button" class="icon-btn" id="toggleKey" title="顯示/隱藏金鑰">👁️</button>
      </div>
    </div>

    <div class="field">
      <label for="modelSelect">模型 (Model)</label>
      <select id="modelSelect"></select>
      <input type="text" id="model" placeholder="自訂模型名稱，例如：gemini-3.6-flash" style="display:none; margin-top:6px;">
      <p class="hint" id="priceHint" style="margin-top:6px;"></p>
    </div>

    <div class="field">
      <label for="saveFolder">
        <span>自動儲存資料夾（位於「下載」內）</span>
      </label>
      <input type="text" id="saveFolder" placeholder="例如：阿吉編譯">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="autoDownload" checked>
      <span>編譯完成後自動儲存單一 .html 檔案至上述資料夾</span>
    </label>
  </div>

  <div class="actions">
    <button type="button" class="btn-secondary" id="btnTest">🔌 測試 API</button>
    <button type="button" class="btn-primary" id="btnSave">💾 儲存設定</button>
  </div>
  <div class="status-msg" id="statusMsg"></div>

  <script src="models.js"></script>
  <script src="popup.js"></script>
</body>
</html>
